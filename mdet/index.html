<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Determinant Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        #app {
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 16px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.5px;
        }

        /* Dimension controls */
        #dimensions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #dimensions select {
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 16px;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            width: 48px;
        }

        #dimensions select:disabled {
            opacity: 0.4;
            color: #484f58;
        }

        #dimensions .dim-label {
            font-size: 14px;
            color: #8b949e;
        }

        #btn-random {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #btn-random.inactive {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
        }

        /* Problem display */
        #problem {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            overflow-x: auto;
            padding: 4px 0;
        }

        .operator {
            font-size: 22px;
            color: #8b949e;
            font-weight: 300;
        }

        /* KaTeX dark theme */
        .katex { color: #e6edf3; }

        /* Hint */
        #hint-btn {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #hint-btn:hover {
            background: #30363d;
        }

        #hint-content {
            display: none;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            width: 100%;
            font-family: 'SF Mono', SFMono-Regular, 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #8b949e;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        #hint-content.visible {
            display: block;
        }

        /* Answer section */
        #answer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        #answer-label {
            font-size: 13px;
            color: #484f58;
            margin-bottom: 4px;
        }

        #answer-input {
            width: 120px;
            height: 52px;
            text-align: center;
            font-size: 22px;
            background: #161b22;
            color: #e6edf3;
            border: 1.5px solid #30363d;
            border-radius: 6px;
            outline: none;
            -moz-appearance: textfield;
        }

        #answer-input::-webkit-outer-spin-button,
        #answer-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #answer-input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.3);
        }

        #answer-input.cell-correct {
            border-color: #3fb950;
            background: #0d2117;
        }

        #answer-input.cell-wrong {
            border-color: #f85149;
            background: #3d1214;
        }

        /* Feedback text */
        #feedback {
            font-size: 18px;
            font-weight: 600;
            min-height: 28px;
            text-align: center;
        }

        #feedback.correct { color: #3fb950; }
        #feedback.wrong { color: #f85149; }

        /* Buttons */
        #buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #buttons button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.15s;
        }

        #buttons button:active {
            opacity: 0.8;
        }

        #btn-new {
            background: #238636;
            color: #fff;
        }

        #btn-submit {
            background: #1f6feb;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>DETERMINANT</h1>

        <div id="dimensions">
            <button id="btn-random">Random</button>
            <span class="dim-label">N =</span>
            <select id="dimN" disabled></select>
        </div>

        <div id="problem">
            <span id="matA"></span>
            <span class="operator">=</span>
        </div>

        <button id="hint-btn">Hint</button>
        <div id="hint-content"></div>

        <div id="answer-section">
            <div id="answer-label"></div>
            <input id="answer-input" type="number">
        </div>

        <div id="feedback" role="alert"></div>

        <div id="buttons">
            <button id="btn-submit">Submit</button>
            <button id="btn-new">New Problem</button>
        </div>
    </div>

    <script>
        function onReady(fn) {
            if (typeof katex !== 'undefined') return fn();
            const id = setInterval(() => {
                if (typeof katex !== 'undefined') { clearInterval(id); fn(); }
            }, 50);
        }

        onReady(() => {
            let N;
            let matA, correctAnswer;
            let submitted = false;
            let randomMode = true;

            const dimN = document.getElementById('dimN');
            const btnRandom = document.getElementById('btn-random');
            const matAEl = document.getElementById('matA');
            const answerLabel = document.getElementById('answer-label');
            const answerInput = document.getElementById('answer-input');
            const feedbackEl = document.getElementById('feedback');
            const btnSubmit = document.getElementById('btn-submit');
            const btnNew = document.getElementById('btn-new');
            const hintBtn = document.getElementById('hint-btn');
            const hintContent = document.getElementById('hint-content');

            // Populate select
            for (let i = 1; i <= 4; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                dimN.appendChild(opt);
            }
            dimN.value = 2;

            dimN.addEventListener('change', generateProblem);

            btnRandom.addEventListener('click', () => {
                randomMode = !randomMode;
                updateRandomState();
                generateProblem();
            });

            function updateRandomState() {
                if (randomMode) {
                    btnRandom.classList.remove('inactive');
                    dimN.disabled = true;
                } else {
                    btnRandom.classList.add('inactive');
                    dimN.disabled = false;
                }
            }

            function randInt(lo, hi) {
                return Math.floor(Math.random() * (hi - lo + 1)) + lo;
            }

            function randomMatrix(n) {
                const mat = [];
                for (let i = 0; i < n; i++) {
                    const row = [];
                    for (let j = 0; j < n; j++) {
                        row.push(randInt(-5, 5));
                    }
                    mat.push(row);
                }
                return mat;
            }

            function determinant(mat) {
                const n = mat.length;
                if (n === 1) return mat[0][0];
                if (n === 2) return mat[0][0] * mat[1][1] - mat[0][1] * mat[1][0];
                let det = 0;
                for (let j = 0; j < n; j++) {
                    const minor = [];
                    for (let r = 1; r < n; r++) {
                        const row = [];
                        for (let c = 0; c < n; c++) {
                            if (c !== j) row.push(mat[r][c]);
                        }
                        minor.push(row);
                    }
                    det += ((j % 2 === 0) ? 1 : -1) * mat[0][j] * determinant(minor);
                }
                return det;
            }

            // Build minor matrix (remove row 0, column j)
            function getMinor(mat, j) {
                const minor = [];
                for (let r = 1; r < mat.length; r++) {
                    const row = [];
                    for (let c = 0; c < mat.length; c++) {
                        if (c !== j) row.push(mat[r][c]);
                    }
                    minor.push(row);
                }
                return minor;
            }

            function matrixToLatex(mat) {
                return '\\begin{bmatrix}' +
                    mat.map(row => row.join(' & ')).join(' \\\\ ') +
                    '\\end{bmatrix}';
            }

            // --- Hint generation ---
            function signedNum(val, isFirst) {
                if (isFirst) return String(val);
                if (val >= 0) return ' + ' + val;
                return ' \u2212 ' + Math.abs(val);
            }

            function generateHint() {
                const L = [];

                if (N === 1) {
                    L.push('The determinant of a 1\u00d71 matrix [a] is a.');
                    L.push('');
                    L.push('det = ' + matA[0][0]);
                } else if (N === 2) {
                    const [a, b] = matA[0];
                    const [c, d] = matA[1];
                    L.push('For a 2\u00d72 matrix:');
                    L.push('  det = a\u00b7d \u2212 b\u00b7c');
                    L.push('');
                    L.push('  = (' + a + ')(' + d + ') \u2212 (' + b + ')(' + c + ')');
                    L.push('  = ' + (a * d) + ' \u2212 (' + (b * c) + ')');
                    L.push('  = ' + correctAnswer);
                } else if (N === 3) {
                    L.push('Cofactor expansion along row 1:');
                    L.push('  det = a\u2081\u2081\u00b7M\u2081\u2081 \u2212 a\u2081\u2082\u00b7M\u2081\u2082 + a\u2081\u2083\u00b7M\u2081\u2083');
                    L.push('');

                    const terms = [];
                    for (let j = 0; j < 3; j++) {
                        const sign = (j % 2 === 0) ? 1 : -1;
                        const coeff = matA[0][j];
                        const minor = getMinor(matA, j);
                        const md = minor[0][0] * minor[1][1] - minor[0][1] * minor[1][0];
                        terms.push({ sign, coeff, minorDet: md, value: sign * coeff * md });

                        const sub = ['1','2','3'];
                        const subscript = ['\u2081','\u2082','\u2083'];
                        L.push('M\u2081' + subscript[j] + ' = det of 2\u00d72 minor (remove row 1, col ' + (j+1) + '):');
                        L.push('  [' + minor[0].join(', ') + ']');
                        L.push('  [' + minor[1].join(', ') + ']');
                        L.push('  = (' + minor[0][0] + ')(' + minor[1][1] + ') \u2212 (' + minor[0][1] + ')(' + minor[1][0] + ')');
                        L.push('  = ' + md);
                        L.push('');
                    }

                    // Combination line
                    let combo = 'det = (' + terms[0].coeff + ')(' + terms[0].minorDet + ')';
                    combo += ' \u2212 (' + terms[1].coeff + ')(' + terms[1].minorDet + ')';
                    combo += ' + (' + terms[2].coeff + ')(' + terms[2].minorDet + ')';
                    L.push(combo);

                    // Sum line
                    let sum = '    = ' + terms[0].value;
                    sum += signedNum(terms[1].value, false);
                    sum += signedNum(terms[2].value, false);
                    L.push(sum);
                    L.push('    = ' + correctAnswer);
                } else if (N === 4) {
                    L.push('Cofactor expansion along row 1:');
                    L.push('  det = +a\u2081\u2081\u00b7M\u2081\u2081 \u2212 a\u2081\u2082\u00b7M\u2081\u2082 + a\u2081\u2083\u00b7M\u2081\u2083 \u2212 a\u2081\u2084\u00b7M\u2081\u2084');
                    L.push('');

                    const subscripts = ['\u2081','\u2082','\u2083','\u2084'];
                    const terms = [];
                    for (let j = 0; j < 4; j++) {
                        const sign = (j % 2 === 0) ? 1 : -1;
                        const coeff = matA[0][j];
                        const minor = getMinor(matA, j);
                        const md = determinant(minor);
                        terms.push({ sign, coeff, minorDet: md, value: sign * coeff * md });

                        const signChar = sign > 0 ? '+' : '\u2212';
                        L.push(signChar + ' (' + Math.abs(coeff) + ') \u00d7 M\u2081' + subscripts[j] + '   (3\u00d73 minor, remove col ' + (j+1) + ')');
                        L.push('  [' + minor[0].join(', ') + ']');
                        L.push('  [' + minor[1].join(', ') + ']');
                        L.push('  [' + minor[2].join(', ') + ']');
                        L.push('  det = ' + md);
                        L.push('  term = ' + (sign * coeff * md));
                        L.push('');
                    }

                    let sum = 'det = ' + terms[0].value;
                    for (let j = 1; j < 4; j++) sum += signedNum(terms[j].value, false);
                    L.push(sum);
                    L.push('    = ' + correctAnswer);
                }

                return L.join('\n');
            }

            // Hint toggle
            hintBtn.addEventListener('click', () => {
                const visible = hintContent.classList.toggle('visible');
                hintBtn.textContent = visible ? 'Hide Hint' : 'Hint';
            });

            function renderProblem() {
                let fontSize = '1.1em';
                if (N >= 4) fontSize = '0.85em';
                else if (N >= 3) fontSize = '0.95em';

                matAEl.style.fontSize = fontSize;
                katex.render('\\det' + matrixToLatex(matA), matAEl, { throwOnError: false, displayMode: false });
            }

            function checkAnswer() {
                const val = answerInput.value.trim();
                if (!/^-?\d+$/.test(val)) {
                    feedbackEl.textContent = 'Enter an integer';
                    feedbackEl.className = 'wrong';
                    return;
                }

                const parsed = parseInt(val);
                answerInput.classList.remove('cell-correct', 'cell-wrong');

                if (parsed === correctAnswer) {
                    submitted = true;
                    answerInput.classList.add('cell-correct');
                    answerInput.disabled = true;
                    feedbackEl.textContent = 'Correct!';
                    feedbackEl.className = 'correct';
                    btnSubmit.textContent = 'Submit';
                } else {
                    submitted = false;
                    answerInput.classList.add('cell-wrong');
                    feedbackEl.textContent = 'Incorrect \u2014 try again';
                    feedbackEl.className = 'wrong';
                    btnSubmit.textContent = 'Resubmit';
                }
            }

            function resetFeedback() {
                submitted = false;
                feedbackEl.textContent = '';
                feedbackEl.className = '';
                btnSubmit.textContent = 'Submit';
                answerInput.classList.remove('cell-correct', 'cell-wrong');
                answerInput.disabled = false;
                answerInput.value = '';
            }

            function generateProblem() {
                if (randomMode) {
                    N = randInt(1, 4);
                    dimN.value = N;
                } else {
                    N = parseInt(dimN.value);
                }

                matA = randomMatrix(N);
                correctAnswer = determinant(matA);

                answerLabel.textContent = N + ' \u00d7 ' + N + ' determinant';

                // Reset hint
                hintContent.classList.remove('visible');
                hintBtn.textContent = 'Hint';
                hintContent.textContent = generateHint();

                resetFeedback();
                renderProblem();
                setTimeout(() => answerInput.focus(), 100);
            }

            // Enter key submits
            answerInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!submitted) checkAnswer();
                }
            });

            btnSubmit.addEventListener('click', () => {
                if (submitted) return;
                answerInput.classList.remove('cell-correct', 'cell-wrong');
                checkAnswer();
            });

            btnNew.addEventListener('click', generateProblem);

            updateRandomState();
            generateProblem();
        });
    </script>
</body>
</html>

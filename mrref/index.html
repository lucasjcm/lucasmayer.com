<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Row Reduction (RREF) Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        #app {
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 16px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.5px;
        }

        /* Dimension controls */
        #dimensions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #dimensions select {
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 16px;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            width: 48px;
        }

        #dimensions select:disabled {
            opacity: 0.4;
            color: #484f58;
        }

        #dimensions .dim-label {
            font-size: 14px;
            color: #8b949e;
        }

        #btn-random {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #btn-random.inactive {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
        }

        /* Problem display */
        #problem {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            overflow-x: auto;
            padding: 4px 0;
        }

        .operator {
            font-size: 22px;
            color: #8b949e;
            font-weight: 300;
        }

        /* KaTeX dark theme */
        .katex { color: #e6edf3; }

        /* Hint */
        #hint-btn {
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #hint-btn:hover {
            background: #30363d;
        }

        #hint-content {
            display: none;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            width: 100%;
            font-family: 'SF Mono', SFMono-Regular, 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #8b949e;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        #hint-content.visible {
            display: block;
        }

        /* Answer section */
        #answer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        #answer-label {
            font-size: 13px;
            color: #484f58;
            margin-bottom: 4px;
        }

        #answer-matrix {
            display: inline-grid;
            gap: 6px;
            padding: 12px 20px;
            position: relative;
            border-left: 2.5px solid #e6edf3;
            border-right: 2.5px solid #e6edf3;
        }

        #answer-matrix::before,
        #answer-matrix::after {
            content: '';
            position: absolute;
            left: -2.5px;
            right: -2.5px;
            height: 8px;
            border-left: 2.5px solid #e6edf3;
            border-right: 2.5px solid #e6edf3;
        }

        #answer-matrix::before {
            top: -1px;
            border-top: 2.5px solid #e6edf3;
        }

        #answer-matrix::after {
            bottom: -1px;
            border-bottom: 2.5px solid #e6edf3;
        }

        #answer-matrix input {
            height: 44px;
            text-align: center;
            font-size: 18px;
            background: #161b22;
            color: #e6edf3;
            border: 1.5px solid #30363d;
            border-radius: 4px;
            outline: none;
            -moz-appearance: textfield;
        }

        #answer-matrix input::-webkit-outer-spin-button,
        #answer-matrix input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #answer-matrix input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.3);
        }

        /* Feedback states */
        #answer-matrix.correct {
            border-color: #3fb950;
        }
        #answer-matrix.correct::before,
        #answer-matrix.correct::after {
            border-color: #3fb950;
        }

        #answer-matrix.wrong {
            border-color: #f85149;
        }
        #answer-matrix.wrong::before,
        #answer-matrix.wrong::after {
            border-color: #f85149;
        }

        #answer-matrix input.cell-correct {
            border-color: #3fb950;
            background: #0d2117;
        }

        #answer-matrix input.cell-wrong {
            border-color: #f85149;
            background: #3d1214;
        }

        /* Feedback text */
        #feedback {
            font-size: 18px;
            font-weight: 600;
            min-height: 28px;
            text-align: center;
        }

        #feedback.correct { color: #3fb950; }
        #feedback.wrong { color: #f85149; }

        /* Buttons */
        #buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #buttons button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.15s;
        }

        #buttons button:active {
            opacity: 0.8;
        }

        #btn-new {
            background: #238636;
            color: #fff;
        }

        #btn-submit {
            background: #1f6feb;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>ROW REDUCTION (RREF)</h1>

        <div id="dimensions">
            <button id="btn-random">Random</button>
            <span class="dim-label">(</span>
            <select id="dimM" disabled></select>
            <span class="dim-label">&times;</span>
            <select id="dimN" disabled></select>
            <span class="dim-label">)</span>
        </div>

        <div id="problem">
            <span id="matA"></span>
            <span class="operator">&xrarr;</span>
        </div>

        <button id="hint-btn">Hint</button>
        <div id="hint-content"></div>

        <div id="answer-section">
            <div id="answer-label"></div>
            <div id="answer-matrix"></div>
        </div>

        <div id="feedback" role="alert"></div>

        <div id="buttons">
            <button id="btn-submit">Submit</button>
            <button id="btn-new">New Problem</button>
        </div>
    </div>

    <script>
        function onReady(fn) {
            if (typeof katex !== 'undefined') return fn();
            const id = setInterval(() => {
                if (typeof katex !== 'undefined') { clearInterval(id); fn(); }
            }, 50);
        }

        onReady(() => {
            let M, N;
            let matA, correctAnswer;
            let hintSteps = [];
            let submitted = false;
            let advanceTimer = null;
            let randomMode = true;

            const dimM = document.getElementById('dimM');
            const dimN = document.getElementById('dimN');
            const btnRandom = document.getElementById('btn-random');
            const matAEl = document.getElementById('matA');
            const answerLabel = document.getElementById('answer-label');
            const answerMatrix = document.getElementById('answer-matrix');
            const feedbackEl = document.getElementById('feedback');
            const btnSubmit = document.getElementById('btn-submit');
            const btnNew = document.getElementById('btn-new');
            const hintBtn = document.getElementById('hint-btn');
            const hintContent = document.getElementById('hint-content');

            // Populate selects
            for (let i = 1; i <= 4; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.textContent = i;
                dimM.appendChild(opt);
            }
            for (let i = 1; i <= 5; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.textContent = i;
                dimN.appendChild(opt);
            }
            dimM.value = 2; dimN.value = 3;

            dimM.addEventListener('change', generateProblem);
            dimN.addEventListener('change', generateProblem);

            btnRandom.addEventListener('click', () => {
                randomMode = !randomMode;
                updateRandomState();
                generateProblem();
            });

            function updateRandomState() {
                if (randomMode) {
                    btnRandom.classList.remove('inactive');
                    dimM.disabled = true; dimN.disabled = true;
                } else {
                    btnRandom.classList.add('inactive');
                    dimM.disabled = false; dimN.disabled = false;
                }
            }

            // --- Exact rational arithmetic ---
            function gcd(a, b) {
                a = Math.abs(a); b = Math.abs(b);
                while (b) { [a, b] = [b, a % b]; }
                return a;
            }

            function frac(n, d) {
                if (d === undefined) d = 1;
                if (d === 0) return [0, 1];
                if (n === 0) return [0, 1];
                const sign = (d < 0) ? -1 : 1;
                const g = gcd(Math.abs(n), Math.abs(d));
                return [sign * n / g, sign * d / g];
            }

            function fracAdd(a, b) { return frac(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); }
            function fracSub(a, b) { return frac(a[0] * b[1] - b[0] * a[1], a[1] * b[1]); }
            function fracMul(a, b) { return frac(a[0] * b[0], a[1] * b[1]); }
            function fracDiv(a, b) { return frac(a[0] * b[1], a[1] * b[0]); }
            function fracIsZero(a) { return a[0] === 0; }
            function fracIsInteger(a) { return a[1] === 1; }

            function fracStr(f) {
                if (f[1] === 1) return String(f[0]);
                return f[0] + '/' + f[1];
            }

            // --- RREF with exact arithmetic ---
            function rref(matrix) {
                const rows = matrix.length;
                const cols = matrix[0].length;
                const mat = matrix.map(row => row.map(v => frac(v)));

                let pivotRow = 0;
                for (let col = 0; col < cols && pivotRow < rows; col++) {
                    let maxVal = 0, maxRow = -1;
                    for (let r = pivotRow; r < rows; r++) {
                        const absVal = Math.abs(mat[r][col][0] / mat[r][col][1]);
                        if (absVal > maxVal) { maxVal = absVal; maxRow = r; }
                    }
                    if (maxRow === -1 || fracIsZero(mat[maxRow][col])) continue;

                    [mat[pivotRow], mat[maxRow]] = [mat[maxRow], mat[pivotRow]];

                    const pivotVal = mat[pivotRow][col];
                    for (let c = 0; c < cols; c++) {
                        mat[pivotRow][c] = fracDiv(mat[pivotRow][c], pivotVal);
                    }

                    for (let r = 0; r < rows; r++) {
                        if (r === pivotRow || fracIsZero(mat[r][col])) continue;
                        const factor = mat[r][col];
                        for (let c = 0; c < cols; c++) {
                            mat[r][c] = fracSub(mat[r][c], fracMul(factor, mat[pivotRow][c]));
                        }
                    }
                    pivotRow++;
                }
                return mat;
            }

            // RREF that also records steps for the hint
            function rrefWithSteps(matrix) {
                const rows = matrix.length;
                const cols = matrix[0].length;
                const mat = matrix.map(row => row.map(v => frac(v)));
                const steps = [];

                function snapshot() {
                    return mat.map(row => '  [' + row.map(fracStr).join(',  ').replace(/,  /g, ',\t') + ']').join('\n');
                }

                // Pad columns for alignment
                function formatMat() {
                    // Find max width per column
                    const widths = [];
                    for (let c = 0; c < cols; c++) {
                        let max = 0;
                        for (let r = 0; r < rows; r++) {
                            max = Math.max(max, fracStr(mat[r][c]).length);
                        }
                        widths.push(max);
                    }
                    return mat.map(row =>
                        '  [' + row.map((f, c) => fracStr(f).padStart(widths[c])).join(', ') + ']'
                    ).join('\n');
                }

                let pivotRow = 0;
                let stepNum = 0;
                for (let col = 0; col < cols && pivotRow < rows; col++) {
                    let maxVal = 0, maxRow = -1;
                    for (let r = pivotRow; r < rows; r++) {
                        const absVal = Math.abs(mat[r][col][0] / mat[r][col][1]);
                        if (absVal > maxVal) { maxVal = absVal; maxRow = r; }
                    }
                    if (maxRow === -1 || fracIsZero(mat[maxRow][col])) continue;

                    if (maxRow !== pivotRow) {
                        [mat[pivotRow], mat[maxRow]] = [mat[maxRow], mat[pivotRow]];
                        stepNum++;
                        steps.push('Step ' + stepNum + ': Swap R' + subscript(pivotRow + 1) + ' \u2194 R' + subscript(maxRow + 1));
                        steps.push(formatMat());
                        steps.push('');
                    }

                    const pivotVal = mat[pivotRow][col];
                    if (!(pivotVal[0] === 1 && pivotVal[1] === 1)) {
                        const pStr = fracStr(pivotVal);
                        for (let c = 0; c < cols; c++) {
                            mat[pivotRow][c] = fracDiv(mat[pivotRow][c], pivotVal);
                        }
                        stepNum++;
                        steps.push('Step ' + stepNum + ': R' + subscript(pivotRow + 1) + ' \u2190 R' + subscript(pivotRow + 1) + ' \u00f7 ' + pStr);
                        steps.push(formatMat());
                        steps.push('');
                    }

                    for (let r = 0; r < rows; r++) {
                        if (r === pivotRow || fracIsZero(mat[r][col])) continue;
                        const factor = mat[r][col];
                        const fStr = fracStr(factor);
                        for (let c = 0; c < cols; c++) {
                            mat[r][c] = fracSub(mat[r][c], fracMul(factor, mat[pivotRow][c]));
                        }
                        stepNum++;
                        steps.push('Step ' + stepNum + ': R' + subscript(r + 1) + ' \u2190 R' + subscript(r + 1) + ' \u2212 (' + fStr + ')\u00b7R' + subscript(pivotRow + 1));
                        steps.push(formatMat());
                        steps.push('');
                    }

                    pivotRow++;
                }
                return steps;
            }

            function subscript(n) {
                const subs = ['\u2080','\u2081','\u2082','\u2083','\u2084','\u2085'];
                return subs[n] || String(n);
            }

            // --- Helpers ---
            function randInt(lo, hi) {
                return Math.floor(Math.random() * (hi - lo + 1)) + lo;
            }

            function randomMatrix(rows, cols) {
                const mat = [];
                for (let i = 0; i < rows; i++) {
                    const row = [];
                    for (let j = 0; j < cols; j++) row.push(randInt(-5, 5));
                    mat.push(row);
                }
                return mat;
            }

            function generateFallbackMatrix(rows, cols) {
                const mat = [];
                for (let i = 0; i < rows; i++) {
                    const row = [];
                    for (let j = 0; j < cols; j++) {
                        if (i === j && j < rows) row.push(1);
                        else if (j >= rows) row.push(randInt(-3, 3));
                        else row.push(0);
                    }
                    mat.push(row);
                }
                for (let op = 0; op < rows * 3; op++) {
                    const r1 = randInt(0, rows - 1);
                    let r2 = randInt(0, rows - 1);
                    if (r2 === r1) continue;
                    const scalar = randInt(-3, 3);
                    if (scalar === 0) continue;
                    for (let c = 0; c < cols; c++) {
                        mat[r1][c] += scalar * mat[r2][c];
                    }
                }
                return mat;
            }

            function matrixToLatex(mat) {
                return '\\begin{bmatrix}' +
                    mat.map(row => row.join(' & ')).join(' \\\\ ') +
                    '\\end{bmatrix}';
            }

            // --- Hint ---
            function generateHint() {
                const L = [];
                L.push('Starting matrix:');

                // Format starting matrix with alignment
                const widths = [];
                for (let c = 0; c < N; c++) {
                    let max = 0;
                    for (let r = 0; r < M; r++) {
                        max = Math.max(max, String(matA[r][c]).length);
                    }
                    widths.push(max);
                }
                matA.forEach(row => {
                    L.push('  [' + row.map((v, c) => String(v).padStart(widths[c])).join(', ') + ']');
                });
                L.push('');

                if (hintSteps.length === 0) {
                    L.push('Already in RREF!');
                } else {
                    L.push(...hintSteps);
                }

                return L.join('\n');
            }

            // Hint toggle
            hintBtn.addEventListener('click', () => {
                const visible = hintContent.classList.toggle('visible');
                hintBtn.textContent = visible ? 'Hide Hint' : 'Hint';
            });

            // --- Rendering ---
            function renderProblem() {
                const maxDim = Math.max(M, N);
                let fontSize = '1.1em';
                if (maxDim >= 4) fontSize = '0.85em';
                else if (maxDim >= 3) fontSize = '0.95em';

                matAEl.style.fontSize = fontSize;
                katex.render(matrixToLatex(matA), matAEl, { throwOnError: false, displayMode: false });
            }

            function renderAnswerGrid() {
                answerMatrix.innerHTML = '';
                answerMatrix.className = '';

                const cellWidth = N >= 5 ? 46 : 52;
                answerMatrix.style.gridTemplateColumns = `repeat(${N}, ${cellWidth}px)`;

                const totalCells = M * N;
                for (let idx = 0; idx < totalCells; idx++) {
                    const r = Math.floor(idx / N);
                    const c = idx % N;

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.style.width = cellWidth + 'px';
                    input.setAttribute('data-row', r);
                    input.setAttribute('data-col', c);
                    input.setAttribute('aria-label', `Row ${r + 1}, Column ${c + 1}`);

                    input.addEventListener('input', () => onCellInput(input, idx));
                    input.addEventListener('keydown', (e) => onCellKeydown(e, idx));

                    answerMatrix.appendChild(input);
                }

                answerLabel.textContent = M + ' \u00d7 ' + N + ' RREF';

                const first = answerMatrix.querySelector('input');
                if (first) setTimeout(() => first.focus(), 100);
            }

            function onCellInput(input, idx) {
                if (submitted) return;
                clearTimeout(advanceTimer);
                const val = input.value;
                if (val === '' || val === '-') return;
                if (/^-?\d+$/.test(val)) {
                    advanceTimer = setTimeout(() => advanceFrom(idx), 600);
                }
            }

            function onCellKeydown(e, idx) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(advanceTimer);
                    if (submitted) return;
                    advanceFrom(idx);
                }
            }

            function advanceFrom(idx) {
                if (submitted) return;
                const inputs = answerMatrix.querySelectorAll('input');
                const nextIdx = idx + 1;
                if (nextIdx < inputs.length) {
                    inputs[nextIdx].focus();
                    inputs[nextIdx].select();
                }
            }

            function checkAnswer() {
                const inputs = answerMatrix.querySelectorAll('input');

                const allFilled = Array.from(inputs).every(inp => /^-?\d+$/.test(inp.value));
                if (!allFilled) {
                    feedbackEl.textContent = 'Fill all cells first';
                    feedbackEl.className = 'wrong';
                    return;
                }

                let allCorrect = true;

                inputs.forEach(input => {
                    const r = parseInt(input.dataset.row);
                    const c = parseInt(input.dataset.col);
                    const val = parseInt(input.value);
                    const expected = correctAnswer[r][c];

                    input.classList.remove('cell-correct', 'cell-wrong');

                    if (val === expected) {
                        input.classList.add('cell-correct');
                    } else {
                        input.classList.add('cell-wrong');
                        allCorrect = false;
                    }
                });

                if (allCorrect) {
                    submitted = true;
                    answerMatrix.classList.add('correct');
                    feedbackEl.textContent = 'Correct!';
                    feedbackEl.className = 'correct';
                    btnSubmit.textContent = 'Submit';
                    inputs.forEach(inp => inp.disabled = true);
                } else {
                    submitted = false;
                    answerMatrix.classList.add('wrong');
                    feedbackEl.textContent = 'Incorrect \u2014 try again';
                    feedbackEl.className = 'wrong';
                    btnSubmit.textContent = 'Resubmit';
                }
            }

            function resetFeedback() {
                submitted = false;
                feedbackEl.textContent = '';
                feedbackEl.className = '';
                btnSubmit.textContent = 'Submit';
                answerMatrix.classList.remove('correct', 'wrong');
                const inputs = answerMatrix.querySelectorAll('input');
                inputs.forEach(inp => {
                    inp.classList.remove('cell-correct', 'cell-wrong');
                    inp.disabled = false;
                });
            }

            function generateProblem() {
                if (randomMode) {
                    M = randInt(1, 4);
                    N = randInt(1, 5);
                    dimM.value = M; dimN.value = N;
                } else {
                    M = parseInt(dimM.value);
                    N = parseInt(dimN.value);
                }

                // Try to find a matrix with integer RREF
                let found = false;
                for (let attempt = 0; attempt < 50; attempt++) {
                    const candidate = randomMatrix(M, N);
                    const result = rref(candidate);
                    const allInteger = result.every(row => row.every(fracIsInteger));
                    if (allInteger) {
                        matA = candidate;
                        correctAnswer = result.map(row => row.map(f => f[0]));
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    matA = generateFallbackMatrix(M, N);
                    const result = rref(matA);
                    correctAnswer = result.map(row => row.map(f => f[0]));
                }

                // Generate hint steps
                hintSteps = rrefWithSteps(matA);

                // Reset hint
                hintContent.classList.remove('visible');
                hintBtn.textContent = 'Hint';
                hintContent.textContent = generateHint();

                resetFeedback();
                renderProblem();
                renderAnswerGrid();
            }

            btnSubmit.addEventListener('click', () => {
                if (submitted) return;
                answerMatrix.classList.remove('correct', 'wrong');
                answerMatrix.querySelectorAll('input').forEach(inp => {
                    inp.classList.remove('cell-correct', 'cell-wrong');
                });
                checkAnswer();
            });

            btnNew.addEventListener('click', generateProblem);

            updateRandomState();
            generateProblem();
        });
    </script>
</body>
</html>
